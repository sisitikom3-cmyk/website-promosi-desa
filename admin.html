/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   BODY
   ===================================================== */

body {

    font-family: "Segoe UI", Arial, sans-serif;

    min-height: 100vh;

    color: #203f2d;

    background:
        linear-gradient(
            135deg,
            #eaf8ef,

/* =====================================================
   BACKGROUND
   ===================================================== */

.background {

    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;

}


/* =====================================================
   KUPU-KUPU
   ===================================================== */

.butterfly {

    position: absolute;
    font-size: 31px;

    animation:
        terbang 16s linear infinite;

}

.butterfly1 {

    top: 12%;
    left: -80px;

}

.butterfly2 {

    top: 42%;
    left: -100px;

    animation-delay: 4s;
    animation-duration: 19s;

}

.butterfly3 {

    top: 72%;
    left: -100px;

    animation-delay: 7s;
    animation-duration: 17s;

}


@keyframes terbang {

    0% {
        transform:
            translate(-100px, 0)
            rotate(0deg);
    }

    20% {
        transform:
            translate(20vw, -35px)
            rotate(10deg);
    }

    40% {
        transform:
            translate(40vw, 30px)
            rotate(-8deg);
    }

    60% {
        transform:
            translate(65vw, -40px)
            rotate(8deg);
    }

    80% {
        transform:
            translate(85vw, 30px)
            rotate(-5deg);
    }

    100% {
        transform:
            translate(110vw, -20px)
            rotate(5deg);
    }

}


/* =====================================================
   BUNGA
   ===================================================== */

.flower {

    position: absolute;
    font-size: 30px;

    animation:
        bunga 5s ease-in-out infinite;

    opacity: .75;

}

.flower1 {
    left: 5%;
    top: 25%;
}

.flower2 {
    right: 5%;
    top: 20%;
    animation-delay: 1s;
}

.flower3 {
    left: 10%;
    bottom: 15%;
    animation-delay: 2s;
}

.flower4 {
    right: 12%;
    bottom: 10%;
    animation-delay: 3s;
}


@keyframes bunga {

    0%,100% {

        transform:
            translateY(0)
            rotate(0);

    }

    50% {

        transform:
            translateY(-14px)
            rotate(8deg);

    }

}

<script>


// =====================================================
// URL GOOGLE APPS SCRIPT
// =====================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzTCoqlRNrkUA14uSr7TtjyacWNlYz4M5g8ZbKJFDlAdiboDV_LEI-s_-CGNUo4NGCBLA/exec";


// =====================================================
// AMBIL DATA
// =====================================================

async function ambilData() {

    const tabel =
        document.getElementById(
            "dataPengaduan"
        );

    const statusInfo =
        document.getElementById(
            "statusInfo"
        );


    tabel.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="loading">

                🔄 Mengambil data dari Google Sheets...

            </td>

        </tr>

    `;


    statusInfo.textContent =
        "Mengambil data pengaduan...";


    try {

        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method: "GET",
                    redirect: "follow"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " +
                response.status
            );

        }


        const hasil =
            await response.json();


        console.log(
            "RESPON GOOGLE SCRIPT:",
            hasil
        );


        if (!hasil.success) {

            throw new Error(
                hasil.message ||
                "Google Script gagal mengirim data."
            );

        }


        tampilkanData(
            hasil.data
        );


    } catch (error) {

        console.error(
            "GAGAL MENGAMBIL DATA:",
            error
        );


        tabel.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    ❌ <b>Gagal mengambil data</b>

                    <br><br>

                    ${escapeHTML(error.message)}

                    <br><br>

                    Tekan tombol
                    <b>Refresh Data</b>
                    untuk mencoba lagi.

                </td>

            </tr>

        `;


        statusInfo.textContent =
            "Gagal mengambil data dari Google Apps Script.";

    }

}


// =====================================================
// TAMPILKAN DATA
// =====================================================

function tampilkanData(data) {

    const tabel =
        document.getElementById(
            "dataPengaduan"
        );


    const statusInfo =
        document.getElementById(
            "statusInfo"
        );


    if (!Array.isArray(data) ||
        data.length === 0) {

        tabel.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    📭 Belum ada pengaduan.

                </td>

            </tr>

        `;


        statusInfo.textContent =
            "Belum ada data pengaduan.";

        return;

    }


    tabel.innerHTML = "";


    data.forEach(
        function(item, index) {


            /*
             * Baris Google Sheets:
             *
             * Baris 1 = header
             * Baris 2 = data pertama
             *
             */

            const row =
                Number(
                    item.row ||
                    index + 2
                );


            const nama =
                item.nama ||
                item.nama_lengkap ||
                "-";


            const nohp =
                item.nohp ||
                item.telepon ||
                item.no_wa ||
                "-";


            const judul =
                item.judul ||
                item.judul_pengaduan ||
                item.ringkasan ||
                "-";


            const deskripsi =
                item.deskripsi ||
                item.isi ||
                item.keterangan ||
                "-";


            const tanggal =
                item.tanggal ||
                item.tanggalKirim ||
                item.tanggal_kirim ||
                "-";


            const status =
                item.status ||
                "Menunggu";


            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>


                <td>

                    <strong>
                        ${escapeHTML(nama)}
                    </strong>

                </td>


                <td>
                    ${escapeHTML(nohp)}
                </td>


                <td class="judul">

                    ${escapeHTML(judul)}

                </td>


                <td class="deskripsi">

                    ${escapeHTML(deskripsi)}

                </td>


                <td class="tanggal">

                    ${escapeHTML(tanggal)}

                </td>


                <td>

                    <select
                        class="status-select"
                        id="status-${row}">

                        <option
                            value="Menunggu"
                            ${status === "Menunggu"
                                ? "selected"
                                : ""}>

                            Menunggu

                        </option>


                        <option
                            value="Diterima"
                            ${status === "Diterima"
                                ? "selected"
                                : ""}>

                            Diterima

                        </option>


                        <option
                            value="Diproses"
                            ${status === "Diproses"
                                ? "selected"
                                : ""}>

                            Diproses

                        </option>


                        <option
                            value="Ditindaklanjuti"
                            ${status === "Ditindaklanjuti"
                                ? "selected"
                                : ""}>

                            Ditindaklanjuti

                        </option>


                        <option
                            value="Selesai"
                            ${status === "Selesai"
                                ? "selected"
                                : ""}>

                            Selesai

                        </option>

                    </select>


                    <br>


                    <button
                        class="btn-simpan"
                        onclick="ubahStatus(${row})">

                        💾 Simpan

                    </button>

                </td>


                <td>

                    <button
                        class="btn-hapus"
                        onclick="hapusPengaduan(${row})">

                        🗑️ Hapus

                    </button>

                </td>

            `;


            tabel.appendChild(tr);

        }
    );


    statusInfo.textContent =
        "Berhasil memuat " +
        data.length +
        " pengaduan.";

}


// =====================================================
// UBAH STATUS
// =====================================================

    const select =
        document.getElementById(
            "status-" + row
        );


    if (!select) {

        alert(
            "❌ Status pengaduan tidak ditemukan."
        );

        return;

    }

            status +

        );
