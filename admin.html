<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   BODY
   ===================================================== */

body {

    font-family: "Segoe UI", Arial, sans-serif;

    min-height: 100vh;

    color: #203f2d;

    background:
        linear-gradient(
            135deg,
            #eaf8ef,
            #e0f5ed,
            #dceefa
        );

    overflow-x: hidden;

}


/* =====================================================
   BACKGROUND
   ===================================================== */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;

}


/* =====================================================
   KUPU-KUPU
   ===================================================== */

.butterfly {

    position: absolute;

    font-size: 31px;

    animation:
        terbang 16s linear infinite;

}


.butterfly1 {

    top: 12%;

    left: -80px;

}


.butterfly2 {

    top: 42%;

    left: -100px;

    animation-delay: 4s;

    animation-duration: 19s;

}


.butterfly3 {

    top: 72%;

    left: -100px;

    animation-delay: 7s;

    animation-duration: 17s;

}


@keyframes terbang {

    0% {
        transform:
            translate(-100px, 0)
            rotate(0deg);
    }

    20% {
        transform:
            translate(20vw, -35px)
            rotate(10deg);
    }

    40% {
        transform:
            translate(40vw, 30px)
            rotate(-8deg);
    }

    60% {
        transform:
            translate(65vw, -40px)
            rotate(8deg);
    }

    80% {
        transform:
            translate(85vw, 30px)
            rotate(-5deg);
    }

    100% {
        transform:
            translate(110vw, -20px)
            rotate(5deg);
    }

}


/* =====================================================
   BUNGA
   ===================================================== */

.flower {

    position: absolute;

    font-size: 30px;

    animation:
        bunga 5s ease-in-out infinite;

    opacity: .75;

}


.flower1 {
    left: 5%;
    top: 25%;
}


.flower2 {
    right: 5%;
    top: 20%;
    animation-delay: 1s;
}


.flower3 {
    left: 10%;
    bottom: 15%;
    animation-delay: 2s;
}


.flower4 {
    right: 12%;
    bottom: 10%;
    animation-delay: 3s;
}


@keyframes bunga {

    0%,100% {
        transform:
            translateY(0)
            rotate(0);
    }

    50% {
        transform:
            translateY(-14px)
            rotate(8deg);
    }

}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {

    position: relative;

    z-index: 5;

    max-width: 1250px;

    margin: auto;

    padding: 30px 18px;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    text-align: center;

    margin-bottom: 25px;

}


.logo {

    font-size: 45px;

}


.header h1 {

    color: #155d36;

    margin: 5px 0;

    font-size: 30px;

}


.header p {

    color: #63776a;

}


/* =====================================================
   ADMIN BAR
   ===================================================== */

.admin-bar {

    max-width: 700px;

    margin: 18px auto 0;

    padding: 12px 18px;

    border-radius: 14px;

    background: rgba(255,255,255,.75);

    border: 1px solid rgba(255,255,255,.9);

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    box-shadow:
        0 8px 25px rgba(31,90,55,.08);

}


.admin-welcome {

    color: #315b43;

    font-size: 14px;

}


.admin-welcome strong {

    color: #155d36;

}


/* =====================================================
   TOMBOL LOGOUT
   ===================================================== */

.logout {

    border: none;

    border-radius: 10px;

    padding: 9px 15px;

    background:
        linear-gradient(
            135deg,
            #c84b4b,
            #a83232
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .3s;

}


.logout:hover {

    transform: translateY(-2px);

}


/* =====================================================
   REFRESH
   ===================================================== */

.refresh-box {

    margin: 20px auto;

    text-align: center;

}


.refresh {

    border: none;

    padding: 13px 28px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #176b3a,
            #269dc1
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 18px rgba(23,107,58,.20);

    transition: .3s;

}


.refresh:hover {

    transform: translateY(-2px);

}


/* =====================================================
   STATUS INFO
   ===================================================== */

.status-info {

    text-align: center;

    margin: 15px 0;

    color: #63776a;

    font-size: 14px;

}


/* =====================================================
   TABEL
   ===================================================== */

.table-wrapper {

    width: 100%;

    overflow-x: auto;

    background: rgba(255,255,255,.90);

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(31,90,55,.12);

    border: 1px solid rgba(255,255,255,.9);

}


table {

    width: 100%;

    min-width: 1100px;

    border-collapse: collapse;

}


thead {

    background:
        linear-gradient(
            135deg,
            #176b3a,
            #268c8c
        );

    color: white;

}


th {

    padding: 16px 12px;

    text-align: left;

    font-size: 15px;

}


td {

    padding: 15px 12px;

    border-bottom: 1px solid #e1ebe5;

    vertical-align: top;

    font-size: 14px;

}


tbody tr:hover {

    background: #f0faf5;

}


/* =====================================================
   JUDUL
   ===================================================== */

.judul {

    font-weight: bold;

    color: #155d36;

    min-width: 180px;

}


/* =====================================================
   DESKRIPSI
   ===================================================== */

.deskripsi {

    min-width: 260px;

    line-height: 1.5;

    color: #52665a;

}


/* =====================================================
   KATEGORI
   ===================================================== */

.kategori {

    font-weight: 600;

}


/* =====================================================
   STATUS
   ===================================================== */

.status-select {

    padding: 9px 10px;

    border-radius: 9px;

    border: 1px solid #bdd8c7;

    background: white;

    color: #204a32;

    font-weight: 600;

    cursor: pointer;

    min-width: 150px;

}


/* =====================================================
   TOMBOL SIMPAN
   ===================================================== */

.btn-simpan {

    margin-top: 7px;

    border: none;

    padding: 8px 12px;

    border-radius: 8px;

    background: #176b3a;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


.btn-simpan:hover {

    background: #0f522b;

}


/* =====================================================
   TOMBOL HAPUS
   ===================================================== */

.btn-hapus {

    border: none;

    padding: 9px 13px;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #d9534f,
            #b52b27
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .3s;

}


.btn-hapus:hover {

    transform: translateY(-2px);

}


/* =====================================================
   TIKET
   ===================================================== */

.tiket {

    font-weight: bold;

    color: #176b3a;

}


/* =====================================================
   EMPTY
   ===================================================== */

.empty {

    text-align: center;

    padding: 45px 20px;

    color: #718277;

}


/* =====================================================
   LOADING
   ===================================================== */

.loading {

    text-align: center;

    padding: 35px;

    color: #176b3a;

    font-weight: bold;

}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 600px) {

    .container {

        padding: 20px 10px;

    }

    .header h1 {

        font-size: 24px;

    }

    .logo {

        font-size: 38px;

    }

    .admin-bar {

        flex-direction: column;

    }

}

</style>

    const tbody =
        document.getElementById("dataPengaduan");

    const info =
        document.getElementById("statusInfo");


    tbody.innerHTML = `

        <tr>

            <td

                class="loading">

                ⏳ Mengambil data dari Google Sheets...

            </td>

        </tr>

    `;


    info.innerText =
        "Mengambil data...";


    try {

        const response =
            await fetch(SCRIPT_URL);


        if (!response.ok) {

            throw new Error(
                "Gagal menghubungi server"
            );

        }


        const data =
            await response.json();


        console.log("DATA:", data);


        tampilkanData(data);


    } catch (error) {

        console.error(error);


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    ❌ Gagal mengambil data.

                    <br><br>

                    Periksa URL Apps Script
                    dan konfigurasi Code.gs.

                </td>

            </tr>

        `;


        info.innerText =
            "Gagal mengambil data";

    }

}
