<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Pengaduan</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .container {
            width: 96%;
            max-width: 1500px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .btn-refresh {
            background: #2563eb;
        }

        .btn-tanggapan {
            background: #16a34a;
        }

        .btn-delete {
            background: #dc2626;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            vertical-align: top;
            text-align: left;
        }

        th {
            background: #1f2937;
            color: white;
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-menunggu {
            background: #fef3c7;
            color: #92400e;
        }

        .status-diproses {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-selesai {
            background: #dcfce7;
            color: #166534;
        }

        .status-ditolak {
            background: #fee2e2;
            color: #991b1b;
        }

        .tiket {
            font-weight: bold;
            white-space: nowrap;
        }

        .kelola {
            white-space: nowrap;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        .error {
            display: none;
            padding: 15px;
            margin-bottom: 20px;
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            border-radius: 7px;
        }

        .jumlah {
            font-weight: bold;
        }

        .tanggapan-text {
            max-width: 300px;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <div class="toolbar">

            <div>

                <h2>
                    📋 Data Pengaduan
                </h2>

                <div class="jumlah">
                    Jumlah Pengaduan:
                    <span id="jumlahData">0</span>
                </div>

            </div>


            <button
                class="btn btn-refresh"
                onclick="loadPengaduan()"
            >
                🔄 Refresh
            </button>

        </div>


        <div
            class="error"
            id="errorBox"
        ></div>


        <div
            class="loading"
            id="loading"
        >
            ⏳ Mengambil data pengaduan...
        </div>


        <div
            class="table-wrapper"
            id="tableWrapper"
            style="display:none;"
        >

            <table>

                <thead>

                    <tr>

                        <th>No</th>

                        <th>Nama</th>

                        <th>No. HP</th>

                        <th>Judul Pengaduan</th>

                        <th>Deskripsi Pengaduan</th>

                        <th>Status</th>

                        <th>Tanggal</th>

                        <th>Tiket</th>

                        <th>Tanggapan</th>

                        <th>Kelola</th>

                    </tr>

                </thead>


                <tbody id="dataPengaduan"></tbody>

            </table>

        </div>

    </div>

</div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzl9v2wCXQhe0_T-AMcfPC1dEy09ico1PpL9vojrANAEhlkvZfgY7shY-wL0y_M7E9z/exec";


const loading =
document.getElementById("loading");

const tableWrapper =
document.getElementById("tableWrapper");

const tbody =
document.getElementById("dataPengaduan");

const errorBox =
document.getElementById("errorBox");

const jumlahData =
document.getElementById("jumlahData");



function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



function statusClass(status) {

    const s =
        String(status || "")
        .toLowerCase();


    if (s.includes("selesai")) {
        return "status-selesai";
    }


    if (s.includes("proses")) {
        return "status-diproses";
    }


    if (s.includes("tolak")) {
        return "status-ditolak";
    }


    return "status-menunggu";

}



async function loadPengaduan() {

    loading.style.display = "block";

    tableWrapper.style.display = "none";

    errorBox.style.display = "none";


    try {

        const response =
            await fetch(API_URL);


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal mengambil data."
            );

        }


        const data =
            result.data || [];


        jumlahData.innerText =
            data.length;


        tbody.innerHTML = "";


        if (data.length === 0) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >
                        Belum ada data pengaduan.
                    </td>

                </tr>

            `;

        }

        else {

            data.forEach(function(item, index) {

                const status =
                    item.status || "Menunggu";


                const tanggapan =
                    item.tanggapan || "Belum ada tanggapan";


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>


                    <td>
                        ${escapeHTML(item.nama)}
                    </td>


                    <td>
                        ${escapeHTML(
                            item.telepon ||
                            item.nohp
                        )}
                    </td>


                    <td>
                        ${escapeHTML(item.judul)}
                    </td>


                    <td>
                        ${escapeHTML(item.deskripsi)}
                    </td>


                    <td>

                        <span
                            class="status ${statusClass(status)}"
                        >
                            ${escapeHTML(status)}
                        </span>

                    </td>


                    <td>
                        ${escapeHTML(item.tanggal)}
                    </td>


                    <td>

                        <span class="tiket">
                            ${escapeHTML(item.tiket)}
                        </span>

                    </td>


                    <td>

                        <div class="tanggapan-text">
                            ${escapeHTML(tanggapan)}
                        </div>

                    </td>


                    <td class="kelola">

                        <button
                            class="btn btn-tanggapan"
                            onclick='beriTanggapan(${JSON.stringify(item)})'
                        >
                            💬 Tanggapan
                        </button>


                        <button
                            class="btn btn-delete"
                            onclick='hapusPengaduan(${JSON.stringify(item)})'
                        >
                            🗑️ Hapus
                        </button>

                    </td>

                `;


                tbody.appendChild(row);

            });

        }


        loading.style.display = "none";

        tableWrapper.style.display = "block";


    }

    catch (error) {

        console.error(error);


        loading.style.display = "none";


        errorBox.innerText =
            error.message ||
            "Gagal mengambil data.";


        errorBox.style.display =
            "block";

    }

}



async function beriTanggapan(item) {

    const statusLama =
        item.status || "Menunggu";


    const tanggapanLama =
        item.tanggapan || "";


    const status =
        prompt(

            "Masukkan status pengaduan:\n\n" +

            "Menunggu\n" +

            "Diproses\n" +

            "Selesai\n" +

            "Ditolak",

            statusLama

        );


    if (status === null) {
        return;
    }


    if (status.trim() === "") {

        alert(
            "❌ Status tidak boleh kosong."
        );

        return;

    }


    const tanggapan =
        prompt(

            "Masukkan tanggapan admin:",

            tanggapanLama

        );


    if (tanggapan === null) {
        return;
    }


    if (tanggapan.trim() === "") {

        alert(
            "❌ Tanggapan tidak boleh kosong."
        );

        return;

    }


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                    "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    action: "update",

                    tiket: item.tiket,

                    status:
                        status.trim(),

                    tanggapan:
                        tanggapan.trim()

                })

            });


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(

                result.message ||
                "Gagal mengirim tanggapan."

            );

        }


        alert(
            "✅ Tanggapan berhasil dikirim."
        );


        loadPengaduan();


    }

    catch (error) {

        console.error(error);


        alert(

            "❌ " +

            (
                error.message ||
                "Gagal mengirim tanggapan."
            )

        );

    }

}



async function hapusPengaduan(item) {

    const tiket =
        item.tiket || "";


    const yakin =
        confirm(

            "Apakah Anda yakin ingin menghapus pengaduan ini?\n\n" +

            "Tiket: " +
            tiket +

            "\nNama: " +
            (item.nama || "")

        );


    if (!yakin) {
        return;
    }


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                    "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    action: "delete",

                    tiket: tiket

                })

            });


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(

                result.message ||
                "Gagal menghapus data."

            );

        }


        alert(
            "✅ Pengaduan berhasil dihapus."
        );


        loadPengaduan();


    }

    catch (error) {

        console.error(error);


        alert(

            "❌ " +

            (
                error.message ||
                "Gagal menghapus data."
            )

        );

    }

}



loadPengaduan();


</script>


</body>

</html>
