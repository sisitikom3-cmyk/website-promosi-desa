<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Pengaduan | Desa Sepadu</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    color: #203f2d;
    background:
        linear-gradient(135deg, #eaf8ef, #e0f5ed, #dceefa);
    overflow-x: hidden;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

/* Kupu-kupu */

.butterfly {
    position: absolute;
    font-size: 31px;
    animation: terbang 16s linear infinite;
}

.butterfly1 {
    top: 12%;
    left: -80px;
}

.butterfly2 {
    top: 42%;
    left: -100px;
    animation-delay: 4s;
    animation-duration: 19s;
}

.butterfly3 {
    top: 72%;
    left: -100px;
    animation-delay: 7s;
    animation-duration: 17s;
}

@keyframes terbang {

    0% {
        transform: translate(-100px, 0) rotate(0deg);
    }

    20% {
        transform: translate(20vw, -35px) rotate(10deg);
    }

    40% {
        transform: translate(40vw, 30px) rotate(-8deg);
    }

    60% {
        transform: translate(65vw, -40px) rotate(8deg);
    }

    80% {
        transform: translate(85vw, 30px) rotate(-5deg);
    }

    100% {
        transform: translate(110vw, -20px) rotate(5deg);
    }

}

/* Bunga */

.flower {
    position: absolute;
    font-size: 30px;
    animation: bunga 5s ease-in-out infinite;
    opacity: .75;
}

.flower1 {
    left: 5%;
    top: 25%;
}

.flower2 {
    right: 5%;
    top: 20%;
    animation-delay: 1s;
}

.flower3 {
    left: 10%;
    bottom: 15%;
    animation-delay: 2s;
}

.flower4 {
    right: 12%;
    bottom: 10%;
    animation-delay: 3s;
}

@keyframes bunga {

    0%,100% {
        transform: translateY(0) rotate(0);
    }

    50% {
        transform: translateY(-14px) rotate(8deg);
    }

}

/* Daun */

.leaf {
    position: absolute;
    top: -40px;
    font-size: 23px;
    opacity: .65;
    animation: daunJatuh linear infinite;
}

.leaf:nth-child(8) {
    left: 10%;
    animation-duration: 10s;
}

.leaf:nth-child(9) {
    left: 25%;
    animation-duration: 13s;
    animation-delay: 2s;
}

.leaf:nth-child(10) {
    left: 48%;
    animation-duration: 11s;
    animation-delay: 4s;
}

.leaf:nth-child(11) {
    left: 70%;
    animation-duration: 14s;
    animation-delay: 1s;
}

.leaf:nth-child(12) {
    left: 88%;
    animation-duration: 12s;
    animation-delay: 3s;
}

@keyframes daunJatuh {

    0% {
        transform: translateY(-40px) rotate(0);
        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    50% {
        transform: translate(50px, 50vh) rotate(180deg);
    }

    100% {
        transform: translate(-70px, 110vh) rotate(360deg);
        opacity: 0;
    }

}

/* ================= CONTAINER ================= */

.container {
    position: relative;
    z-index: 5;
    max-width: 1250px;
    margin: auto;
    padding: 30px 18px;
}

/* ================= HEADER ================= */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 45px;
}

.header h1 {
    color: #155d36;
    margin: 5px 0;
    font-size: 30px;
}

.header p {
    color: #63776a;
}

/* ================= DASHBOARD ================= */

.dashboard {
    background: rgba(255,255,255,.84);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 26px;
    padding: 25px;
    box-shadow: 0 20px 50px rgba(31,90,55,.13);
}

/* ================= TOP ================= */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.topbar h2 {
    color: #205d3b;
}

.info {
    color: #718077;
    font-size: 14px;
}

.refresh {
    width: auto;
    padding: 11px 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#187047,#258db2);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.refresh:hover {
    transform: translateY(-2px);
}

/* ================= TABLE ================= */

.table-wrapper {
    overflow-x: auto;
    border-radius: 17px;
    border: 1px solid #d6e6dc;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
    background: rgba(255,255,255,.7);
}

thead {
    background: linear-gradient(135deg,#17633b,#247b99);
    color: white;
}

th {
    padding: 15px 12px;
    text-align: left;
    font-size: 14px;
}

td {
    padding: 13px 12px;
    border-bottom: 1px solid #e0ebe4;
    font-size: 14px;
    vertical-align: top;
}

tbody tr {
    transition: .25s;
}

tbody tr:hover {
    background: #f0faf4;
}

/* ================= STATUS ================= */

.status {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 20px;
    background: #fff0c5;
    color: #876400;
    font-weight: 600;
    white-space: nowrap;
}

.status.selesai {
    background: #dff5e5;
    color: #22703e;
}

.status.diproses {
    background: #dff1fb;
    color: #17678a;
}

/* ================= LOADING ================= */

#loading {
    text-align: center;
    padding: 30px;
    color: #63776a;
}

#pesan {
    text-align: center;
    padding: 30px;
    color: #b04a4a;
    display: none;
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    margin-top: 22px;
    color: #718077;
    font-size: 13px;
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    .container {
        padding: 20px 10px;
    }

    .dashboard {
        padding: 17px;
        border-radius: 20px;
    }

    .topbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .refresh {
        width: 100%;
    }

    .header h1 {
        font-size: 24px;
    }

}

</style>
</head>

<body>

<div class="background">

    <!-- Kupu-kupu -->
    <div class="butterfly butterfly1">🦋</div>
    <div class="butterfly butterfly2">🦋</div>
    <div class="butterfly butterfly3">🦋</div>

    <!-- Bunga -->
    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌺</div>
    <div class="flower flower3">🌼</div>
    <div class="flower flower4">🌷</div>

    <!-- Daun -->
    <div class="leaf">🍃</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍃</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍃</div>

</div>


<div class="container">

    <div class="header">

        <div class="logo">🌿</div>

        <h1>Dashboard Pengaduan Desa</h1>

        <p>
            Desa Sepadu • Dusun Semayang
        </p>

    </div>


    <div class="dashboard">

        <div class="topbar">

            <div>
                <h2>📋 Data Pengaduan Masyarakat</h2>

                <div class="info">
                    Data diambil langsung dari Google Sheets
                </div>
            </div>

            <button
                class="refresh"
                onclick="ambilData()">
                🔄 Refresh Data
            </button>

        </div>


        <div id="loading">
            🌿 Memuat data pengaduan...
        </div>

        <div id="pesan"></div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>No. HP</th>
                        <th>Judul Pengaduan</th>
                        <th>Deskripsi Pengaduan</th>
                        <th>Status</th>
                        <th>Tanggal</th>
                    </tr>

                </thead>

                <tbody id="tabelData"></tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        🌸 Sistem Aspirasi & Pengaduan Desa Sepadu 🌸
    </div>

</div>


<script>

/* URL GOOGLE APPS SCRIPT */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx5kg7IwIo6VoYoWbjnRA4cQf3f-Ok4RPSJzh0b4pwmQl6WpSTwAVyk-PeC1ibzke7c/exec";


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function ambilData() {

    const loading = document.getElementById("loading");
    const tabel = document.getElementById("tabelData");
    const pesan = document.getElementById("pesan");

    loading.style.display = "block";
    pesan.style.display = "none";

    tabel.innerHTML = "";

    fetch(SCRIPT_URL)

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Gagal menghubungi server."
                );
            }

            return response.json();

        })

        .then(result => {

            loading.style.display = "none";

            if (!result.success) {

                throw new Error(
                    result.message ||
                    "Gagal mengambil data."
                );

            }

            const data = result.data || [];

            if (data.length === 0) {

                tabel.innerHTML = `
                    <tr>
                        <td colspan="7"
                            style="text-align:center;padding:30px;">
                            🌸 Belum ada pengaduan masuk.
                        </td>
                    </tr>
                `;

                return;
            }


            data.forEach(row => {

                let status =
                    row["Status"] || "Menunggu";

                let statusClass =
                    String(status)
                    .toLowerCase()
                    .replace(/\s+/g, "");


                const tr =
                    document.createElement("tr");


                tr.innerHTML = `

                    <td>
                        <strong>
                            ${escapeHTML(row["ID"])}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(row["Nama"])}
                    </td>

                    <td>
                        ${escapeHTML(row["No.HP"])}
                    </td>

                    <td>
                        <strong>
                            ${escapeHTML(
                                row["Judul Pengaduan"]
                            )}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(
                            row["Deskripsi Pengaduan"]
                        )}
                    </td>

                    <td>
                        <span class="status ${statusClass}">
                            ${escapeHTML(status)}
                        </span>
                    </td>

                    <td>
                        ${escapeHTML(row["Tanggal"])}
                    </td>

                `;

                tabel.appendChild(tr);

            });

        })

        .catch(error => {

            loading.style.display = "none";

            pesan.style.display = "block";

            pesan.innerHTML =
                "❌ " +
                escapeHTML(error.message);

        });

}


/* Ambil data otomatis ketika halaman dibuka */

document.addEventListener(
    "DOMContentLoaded",
    ambilData
);

</script>

</body>
</html>
