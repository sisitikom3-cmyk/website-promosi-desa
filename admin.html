<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Pengaduan - Desa Sepadu</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f7f3;
    color: #263b2a;
}

header {
    background: linear-gradient(135deg, #176b3a, #2e9d5b);
    color: white;
    padding: 20px;
}

.header-content {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 5px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
    flex-wrap: wrap;
}

button,
.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

.btn-refresh {
    background: #176b3a;
    color: white;
}

.btn-refresh:hover {
    background: #0e522b;
}

.btn-back {
    background: white;
    color: #176b3a;
    text-decoration: none;
}

.btn-delete {
    background: #dc3545;
    color: white;
}

.btn-delete:hover {
    background: #b02a37;
}

.status-info {
    padding: 12px 15px;
    background: white;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.table-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 950px;
}

th {
    background: #176b3a;
    color: white;
    padding: 13px 10px;
    text-align: left;
    white-space: nowrap;
}

td {
    padding: 12px 10px;
    border-bottom: 1px solid #ddd;
    vertical-align: top;
}

tr:hover {
    background: #f7fbf8;
}

select {
    padding: 8px;
    border-radius: 7px;
    border: 1px solid #ccc;
    min-width: 150px;
}

.loading {
    text-align: center;
    padding: 30px;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.error {
    background: #ffe5e5;
    color: #a00;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.success {
    background: #e3f7e9;
    color: #176b3a;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.description {
    max-width: 250px;
    white-space: normal;
    word-break: break-word;
}

.actions {
    display: flex;
    gap: 8px;
    flex-direction: column;
}

.logout {
    background: #b02a37;
    color: white;
}

.logout:hover {
    background: #8c1f2b;
}
</style>

</head>

<body>

<header>

<div class="header-content">

<div>
<h1>🌿 Admin Pengaduan Desa Sepadu</h1>
<p>Kelola Aspirasi & Pengaduan Masyarakat</p>
</div>

<div>

<a href="index.html" class="btn btn-back">
← Kembali
</a>

<button class="logout" onclick="logoutAdmin()">
Logout
</button>

</div>

</div>

</header>


<div class="container">

<div class="top-bar">

<h2>📋 Data Pengaduan</h2>

<button class="btn-refresh" onclick="ambilData()">
🔄 Refresh Data
</button>

</div>


<div id="pesan"></div>


<div class="status-info">

<strong>Total Pengaduan:</strong>

<span id="jumlahData">
0
</span>

</div>


<div class="table-wrapper">

<table>

<thead>

<tr>

<th>No</th>

<th>ID Pengaduan</th>

<th>Nama</th>

<th>No HP / WA</th>

<th>Judul Pengaduan</th>

<th>Deskripsi</th>

<th>Status</th>

<th>Tanggal</th>

<th>Aksi</th>

</tr>

</thead>


<tbody id="dataPengaduan">

<tr>

<td colspan="9" class="loading">
⏳ Mengambil data...
</td>

</tr>

</tbody>

</table>

</div>

</div>


<script>

// =====================================================
// URL GOOGLE APPS SCRIPT
// =====================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwdPAd4go9Z7ETCT1bLvqJohBafvanU3ZSJFrKWxEpyWRoPoldE7ZJnB8bwy4I8xBSjKQ/exec";


// =====================================================
// CEK LOGIN ADMIN
// =====================================================

if (sessionStorage.getItem("adminLogin") !== "true") {

    window.location.href = "loginadmin.html";

}


// =====================================================
// AMBIL DATA DARI GOOGLE SHEETS
// =====================================================

async function ambilData() {

    const tabel =
        document.getElementById("dataPengaduan");

    tabel.innerHTML = `
        <tr>
            <td colspan="9" class="loading">
                ⏳ Mengambil data...
            </td>
        </tr>
    `;

    document.getElementById("pesan").innerHTML = "";

    try {

        const response =
            await fetch(SCRIPT_URL);

        if (!response.ok) {

            throw new Error(
                "Gagal terhubung ke Google Apps Script."
            );

        }

        const hasil =
            await response.json();

        console.log("DATA DARI SCRIPT:", hasil);


        if (!hasil.success) {

            throw new Error(
                hasil.message ||
                "Gagal mengambil data."
            );

        }


        const data =
            hasil.data || [];


        document.getElementById("jumlahData")
            .textContent = data.length;


        if (data.length === 0) {

            tabel.innerHTML = `
                <tr>
                    <td colspan="9" class="empty">
                        📭 Belum ada pengaduan.
                    </td>
                </tr>
            `;

            return;

        }


        tabel.innerHTML = "";


        data.forEach(function(item, index) {

            const row =
                Number(item.row);


            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td>${index + 1}</td>

                <td>
                    <strong>
                        ${escapeHTML(item.id)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(item.nama)}
                </td>

                <td>
                    ${escapeHTML(item.nohp)}
                </td>

                <td>
                    ${escapeHTML(item.judul)}
                </td>

                <td class="description">
                    ${escapeHTML(item.deskripsi)}
                </td>

                <td>

                    <select
                        onchange="ubahStatus(${row}, this.value)"
                    >

                        <option value="Menunggu"
                        ${item.status === "Menunggu" ? "selected" : ""}>
                        Menunggu
                        </option>

                        <option value="Diterima"
                        ${item.status === "Diterima" ? "selected" : ""}>
                        Diterima
                        </option>

                        <option value="Diproses"
                        ${item.status === "Diproses" ? "selected" : ""}>
                        Diproses
                        </option>

                        <option value="Ditindaklanjuti"
                        ${item.status === "Ditindaklanjuti" ? "selected" : ""}>
                        Ditindaklanjuti
                        </option>

                        <option value="Selesai"
                        ${item.status === "Selesai" ? "selected" : ""}>
                        Selesai
                        </option>

                    </select>

                </td>

                <td>
                    ${escapeHTML(item.tanggal)}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn-delete"
                            onclick="hapusPengaduan(${row})"
                        >
                            🗑️ Hapus
                        </button>

                    </div>

                </td>

            `;


            tabel.appendChild(tr);

        });


    } catch (error) {

        console.error(error);

        tabel.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    ❌ Gagal mengambil data.
                </td>
            </tr>
        `;

        document.getElementById("pesan").innerHTML = `
            <div class="error">
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


// =====================================================
// UBAH STATUS
// SESUAI DENGAN doPost(e)
// =====================================================

async function ubahStatus(row, status) {

    if (!row) {

        alert("Nomor baris tidak valid.");

        return;

    }


    const konfirmasi =
        confirm(
            "Ubah status pengaduan menjadi: " +
            status +
            "?"
        );


    if (!konfirmasi) {

        ambilData();

        return;

    }


    try {

        const response =
            await fetch(SCRIPT_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body: JSON.stringify({

                    action: "updateStatus",

                    row: row,

                    status: status

                })

            });


        const hasil =
            await response.json();


        console.log(
            "HASIL UPDATE:",
            hasil
        );


        if (!hasil.success) {

            throw new Error(
                hasil.message ||
                "Status gagal diubah."
            );

        }


        document.getElementById("pesan")
            .innerHTML = `
                <div class="success">
                    ✅ ${escapeHTML(hasil.message)}
                </div>
            `;


        ambilData();


    } catch (error) {

        console.error(error);

        alert(
            "Gagal mengubah status: " +
            error.message
        );

        ambilData();

    }

}


// =====================================================
// HAPUS PENGADUAN
// SESUAI DENGAN doPost(e)
// =====================================================

async function hapusPengaduan(row) {

    if (!row) {

        alert("Nomor baris tidak valid.");

        return;

    }


    const konfirmasi =
        confirm(
            "Yakin ingin menghapus pengaduan ini?\n\n" +
            "Data yang sudah dihapus tidak dapat dikembalikan."
        );


    if (!konfirmasi) {

        return;

    }


    try {

        const response =
            await fetch(SCRIPT_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body: JSON.stringify({

                    action: "delete",

                    row: row

                })

            });


        const hasil =
            await response.json();


        console.log(
            "HASIL DELETE:",
            hasil
        );


        if (!hasil.success) {

            throw new Error(
                hasil.message ||
                "Pengaduan gagal dihapus."
            );

        }


        document.getElementById("pesan")
            .innerHTML = `
                <div class="success">
                    🗑️ ${escapeHTML(hasil.message)}
                </div>
            `;


        ambilData();


    } catch (error) {

        console.error(error);

        alert(
            "Gagal menghapus pengaduan: " +
            error.message
        );

    }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// =====================================================
// LOGOUT
// =====================================================

function logoutAdmin() {

    sessionStorage.removeItem(
        "adminLogin"
    );

    window.location.href =
        "loginadmin.html";

}


// =====================================================
// JALANKAN SAAT HALAMAN DIBUKA
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        ambilData();

    }
);

</script>

</body>

  </html>
