<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cek Pengaduan - Desa Sepadu</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f3;
    color: #263b2a;
}

.container {
    max-width: 700px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #176b3a;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #176b3a;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0f542c;
}

#loading {
    display: none;
    text-align: center;
    margin-top: 20px;
}

#hasil {
    display: none;
    margin-top: 25px;
}

.data-box {
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
}

.data-title {
    background: #176b3a;
    color: white;
    padding: 10px;
    font-weight: bold;
}

.data-content {
    padding: 15px;
    white-space: pre-wrap;
}

.status {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 20px;
    background: #fff3cd;
    font-weight: bold;
}

.error {
    color: #c62828;
    margin-top: 15px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Cek Pengaduan</h1>

<p class="subtitle">
Masukkan nomor tiket pengaduan Anda untuk melihat status dan tanggapan dari Desa Sepadu.
</p>


<label>
Nomor Tiket
</label>

<input
    type="text"
    id="tiket"
    placeholder="Contoh: TKT-20260916083000"
>


<button onclick="cekPengaduan()">
    🔍 Cek Pengaduan
</button>


<div id="loading">
    Mencari data pengaduan...
</div>


<div id="error"
class="error">
</div>


<div id="hasil">


<div class="data-box">

<div class="data-title">
Nomor Tiket
</div>

<div
class="data-content"
id="hasilTiket">
</div>

</div>


<div class="data-box">

<div class="data-title">
Nama Pelapor
</div>

<div
class="data-content"
id="hasilNama">
</div>

</div>


<div class="data-box">

<div class="data-title">
Judul Pengaduan
</div>

<div
class="data-content"
id="hasilJudul">
</div>

</div>


<div class="data-box">

<div class="data-title">
Deskripsi
</div>

<div
class="data-content"
id="hasilDeskripsi">
</div>

</div>


<div class="data-box">

<div class="data-title">
Status
</div>

<div class="data-content">

<span
class="status"
id="hasilStatus">
</span>

</div>

</div>


<div class="data-box">

<div class="data-title">
Tanggal
</div>

<div
class="data-content"
id="hasilTanggal">
</div>

</div>


<div class="data-box">

<div class="data-title">
Tanggapan Desa
</div>

<div
class="data-content"
id="hasilTanggapan">
</div>

</div>


</div>

</div>

</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz6sETq3LEHE-savA7beCu1ArRD0suF63miWzxtQaiGdBBEoxw7MY6u93MXi6fzSqFjRA/exec";


async function cekPengaduan() {

    const tiket =
        document.getElementById(
            "tiket"
        ).value.trim();


    const loading =
        document.getElementById(
            "loading"
        );

    const hasil =
        document.getElementById(
            "hasil"
        );

    const error =
        document.getElementById(
            "error"
        );


    hasil.style.display = "none";

    error.textContent = "";


    if (!tiket) {

        error.textContent =
            "Silakan masukkan nomor tiket.";

        return;

    }


    loading.style.display = "block";


    try {

        const response =
            await fetch(
                SCRIPT_URL
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal mengambil data."
            );

        }


        const data =
            result.data || [];


        const ditemukan =
            data.find(function(item) {

                return String(
                    item.tiket
                ).trim().toLowerCase()
                === tiket.toLowerCase();

            });


        if (!ditemukan) {

            error.textContent =
                "Nomor tiket tidak ditemukan.";

            return;

        }


        document.getElementById(
            "hasilTiket"
        ).textContent =
            ditemukan.tiket || "-";


        document.getElementById(
            "hasilNama"
        ).textContent =
            ditemukan.nama || "-";


        document.getElementById(
            "hasilJudul"
        ).textContent =
            ditemukan.judul || "-";


        document.getElementById(
            "hasilDeskripsi"
        ).textContent =
            ditemukan.deskripsi || "-";


        document.getElementById(
            "hasilStatus"
        ).textContent =
            ditemukan.status || "Menunggu";


        document.getElementById(
            "hasilTanggal"
        ).textContent =
            ditemukan.tanggal || "-";


        document.getElementById(
            "hasilTanggapan"
        ).textContent =
            ditemukan.tanggapan ||
            "Belum ada tanggapan dari desa.";


        hasil.style.display =
            "block";


    } catch (err) {

        error.textContent =
            "Gagal terhubung ke Google Script: " +
            err.message;

    } finally {

        loading.style.display =
            "none";

    }

}

</script>

</body>

</html>
