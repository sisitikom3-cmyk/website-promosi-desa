<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aspirasi & Pengaduan - Desa Sepadu</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #eaf8ef,
            #dff4eb,
            #dceefa
        );

    color: #23402e;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 50px;
}

.header h1 {
    margin: 5px 0;
    color: #176b3a;
}

.header p {
    color: #607568;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.10);
}

.intro {
    background: #effaf2;
    border-left: 5px solid #24875d;

    padding: 15px;
    border-radius: 10px;

    line-height: 1.6;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;

    font-weight: bold;
    color: #245339;
}

input,
textarea {
    width: 100%;

    padding: 14px;

    border: 1px solid #d5e3da;

    border-radius: 12px;

    font-size: 15px;

    outline: none;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #24875d;
}

button {
    width: 100%;

    padding: 15px;

    border: none;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #176f47,
            #268fb1
        );

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: .7;
    cursor: not-allowed;
}


/* ==============================
   POPUP
============================== */

.popup {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.45);

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 9999;
}

.popup-box {
    width: 100%;
    max-width: 450px;

    background: white;

    border-radius: 20px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.2);
}

.popup-icon {
    font-size: 50px;
}

.popup-box h2 {
    color: #176b3a;
}

.ticket-box {
    background: #effaf2;

    padding: 15px;

    border-radius: 12px;

    margin: 18px 0;
}

.ticket-box small {
    color: #607568;
}

.ticket-box strong {
    display: block;

    font-size: 22px;

    color: #176f47;

    margin-top: 5px;
}

.btn-status {
    display: block;

    text-decoration: none;

    background:
        linear-gradient(
            135deg,
            #176f47,
            #268fb1
        );

    color: white;

    padding: 13px;

    border-radius: 10px;

    font-weight: bold;

    margin-top: 12px;
}

.btn-close {
    margin-top: 10px;

    background: #e9efeb;

    color: #245339;
}
