<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Pengaduan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .hasil {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #ecfdf5;
            border: 1px solid #10b981;
        }

        .tiket {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        .info {
            text-align: center;
            line-height: 1.6;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>📢 Form Pengaduan</h2>

        <form id="formPengaduan">

            <label for="nama">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                required
            >

            <label for="nohp">
                No. HP
            </label>

            <input
                type="tel"
                id="nohp"
                name="nohp"
                placeholder="Masukkan nomor HP"
                required
            >

            <label for="judul">
                Judul Pengaduan
            </label>

            <input
                type="text"
                id="judul"
                name="judul"
                placeholder="Masukkan judul pengaduan"
                required
            >

            <label for="deskripsi">
                Deskripsi Pengaduan
            </label>

            <textarea
                id="deskripsi"
                name="deskripsi"
                placeholder="Jelaskan pengaduan Anda..."
                required
            ></textarea>

            <button type="submit" id="btnKirim">
                📤 Kirim Pengaduan
            </button>

        </form>

        <div class="hasil" id="hasil">

            <div class="info">
                <strong>✅ Pengaduan berhasil dikirim!</strong>

                <p>
                    Simpan nomor tiket berikut untuk mengecek
                    perkembangan pengaduan Anda.
                </p>
            </div>

            <div class="tiket" id="nomorTiket">
                -
            </div>

            <div class="info">
                Gunakan nomor tiket tersebut pada halaman
                <b>Cek Pengaduan</b>.
            </div>

        </div>

        <div class="error" id="error">
        </div>

    </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwaXiwSNbZjEowc-MBEN_SMDX5NSnMuBwf1FK4Fd0AO4Eqkti-M6JUrotDK4SmtJEL7/exec";


const form =
document.getElementById("formPengaduan");

const btnKirim =
document.getElementById("btnKirim");

const hasil =
document.getElementById("hasil");

const errorBox =
document.getElementById("error");


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    hasil.style.display = "none";
    errorBox.style.display = "none";

    btnKirim.disabled = true;
    btnKirim.innerText = "⏳ Mengirim...";


    const data = {

        action: "add",

        nama:
        document.getElementById("nama").value.trim(),

        nohp:
        document.getElementById("nohp").value.trim(),

        judul:
        document.getElementById("judul").value.trim(),

        deskripsi:
        document.getElementById("deskripsi").value.trim()

    };


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify(data)

        });


        const result =
        await response.json();


        if (result.success) {

            form.reset();

            document.getElementById("nomorTiket")
                .innerText =
                result.tiket || "-";

            hasil.style.display = "block";

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

        } else {

            errorBox.innerText =
                result.message ||
                "Pengaduan gagal dikirim.";

            errorBox.style.display = "block";

        }

    } catch (error) {

        console.error(error);

        errorBox.innerText =
            "Tidak dapat terhubung ke server pengaduan.";

        errorBox.style.display = "block";

    }


    btnKirim.disabled = false;
    btnKirim.innerText =
        "📤 Kirim Pengaduan";

});

</script>

</body>
</html>
