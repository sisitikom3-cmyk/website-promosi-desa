<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aspirasi & Pengaduan | Desa Sepadu</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(74,180,105,.13),transparent 25%),
        radial-gradient(circle at 90% 30%,rgba(46,157,91,.10),transparent 25%),
        linear-gradient(135deg,#f3fbf5,#e8f6ec);
    color:#26372c;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND DAUN
========================= */

.leaf{
    position:fixed;
    z-index:0;
    pointer-events:none;
    opacity:.18;
    font-size:70px;
    animation:leafFloat 7s ease-in-out infinite;
}

.leaf1{
    left:-20px;
    top:170px;
}

.leaf2{
    right:-15px;
    top:430px;
    animation-delay:2s;
}

.leaf3{
    left:10px;
    bottom:80px;
    font-size:55px;
    animation-delay:4s;
}

@keyframes leafFloat{
    0%,100%{
        transform:rotate(-8deg) translateY(0);
    }

    50%{
        transform:rotate(8deg) translateY(-18px);
    }
}

/* =========================
   KUPU-KUPU
========================= */

.butterfly{
    position:fixed;
    z-index:5;
    pointer-events:none;
    font-size:32px;
    filter:drop-shadow(0 4px 7px rgba(0,0,0,.15));
}

.butterfly1{
    top:17%;
    left:-60px;
    animation:
        fly1 16s linear infinite,
        wing 0.22s ease-in-out infinite alternate;
}

.butterfly2{
    top:54%;
    right:-60px;
    font-size:28px;
    animation:
        fly2 19s linear infinite,
        wing 0.25s ease-in-out infinite alternate;
    animation-delay:4s;
}

.butterfly3{
    top:76%;
    left:-60px;
    font-size:24px;
    animation:
        fly3 22s linear infinite,
        wing 0.20s ease-in-out infinite alternate;
    animation-delay:8s;
}

@keyframes fly1{
    0%{
        transform:translateX(0) translateY(0) rotate(8deg);
    }

    25%{
        transform:translateX(25vw) translateY(-60px) rotate(-5deg);
    }

    50%{
        transform:translateX(52vw) translateY(35px) rotate(8deg);
    }

    75%{
        transform:translateX(78vw) translateY(-45px) rotate(-8deg);
    }

    100%{
        transform:translateX(110vw) translateY(10px) rotate(8deg);
    }
}

@keyframes fly2{
    0%{
        transform:translateX(0) translateY(0) rotate(-8deg);
    }

    25%{
        transform:translateX(-25vw) translateY(45px) rotate(7deg);
    }

    50%{
        transform:translateX(-52vw) translateY(-55px) rotate(-5deg);
    }

    75%{
        transform:translateX(-78vw) translateY(35px) rotate(8deg);
    }

    100%{
        transform:translateX(-110vw) translateY(-10px) rotate(-8deg);
    }
}

@keyframes fly3{
    0%{
        transform:translateX(0) translateY(0);
    }

    30%{
        transform:translateX(30vw) translateY(-45px);
    }

    60%{
        transform:translateX(65vw) translateY(30px);
    }

    100%{
        transform:translateX(110vw) translateY(-20px);
    }
}

@keyframes wing{
    from{
        scale:1;
    }

    to{
        scale:.88 1.08;
    }
}

   HEADER
========================= */
