* {

}

body {

}

header {

    color: white;
    padding: 25px 20px;

}

header h1 {
    margin: 0 0 8px;

header p {

}

.container {
    max-width: 850px;

.card {
    background: white;

    color: #176b3a;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

small {
    color: #666;
    font-weight: normal;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #176b3a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #12582f;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.kembali {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    color: #176b3a;
    font-weight: bold;
}

.info {
    background: #eef8f0;
    border-left: 4px solid #2e9d5b;
    padding: 12px;
    margin: 15px 0;
    font-size: 14px;
}

</style>

</head>
